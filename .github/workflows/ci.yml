name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flake8 black==24.10.0 isort
          pip install -r ai-engine/requirements.txt

      - name: Format with black
        run: black ai-engine/ --exclude legacy

      - name: Lint with flake8
        run: flake8 ai-engine/ --exclude legacy --max-line-length=100 --ignore=E501,W503

  validate-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose files
        run: |
          for f in docker/docker-compose.*.yml; do
            echo "Validating $f..."
            docker compose -f "$f" config -q && echo "  OK" || exit 1
          done

  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON configs
        run: |
          python3 -m json.tool thehive-config/case-templates.json > /dev/null
          python3 -m json.tool shuffle-workflows/ssh-bruteforce.json > /dev/null
          python3 -m json.tool shuffle-workflows/malware-detection.json > /dev/null
          echo "All JSON configs valid"

      - name: Validate XML rules
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          ET.parse('wazuh-config/custom-rules.xml')
          print('Wazuh rules XML valid')
          "

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r ai-engine/requirements.txt pytest

      - name: Run test-suite
        run: |
          python3 -m pytest tests/ -q

      - name: Run smoke test
        run: |
          python3 scripts/smoke_test.py --no-report
