<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1120" height="760" fill="#f8fafc"/>
  <text x="560" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">AI-Augmented SOC Lab — implemented pipeline (audit 2026-09-12)</text>
  <text x="560" y="56" text-anchor="middle" font-size="12" fill="#64748b">green = implemented &amp; tested · amber = implemented, not verified live · red/dashed = not implemented</text>

  <!-- Row 1: detection sources -->
  <rect x="40" y="90" width="160" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="120" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">Wazuh</text>
  <text x="120" y="138" text-anchor="middle" font-size="11" fill="#14532d">SIEM / EDR</text>
  <text x="120" y="152" text-anchor="middle" font-size="10" fill="#166534">compose ✓ (not booted)</text>

  <rect x="240" y="90" width="160" height="70" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-dasharray="6 4"/>
  <text x="320" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">Suricata / Zeek</text>
  <text x="320" y="138" text-anchor="middle" font-size="11" fill="#7f1d1d">IDS / net analysis</text>
  <text x="320" y="152" text-anchor="middle" font-size="10" fill="#991b1b">NOT in repo</text>

  <rect x="440" y="90" width="200" height="70" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="540" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#713f12">Synthetic test alerts</text>
  <text x="540" y="130" text-anchor="middle" font-size="11" fill="#713f12">scripts/send-test-alert.py,</text>
  <text x="540" y="145" text-anchor="middle" font-size="11" fill="#713f12">tests/scenarios.py (labelled test data)</text>

  <rect x="700" y="90" width="180" height="70" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="790" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#713f12">Shuffle (SOAR)</text>
  <text x="790" y="138" text-anchor="middle" font-size="11" fill="#713f12">workflow JSON = reference spec</text>
  <text x="790" y="152" text-anchor="middle" font-size="10" fill="#92400e">(not native-importable)</text>

  <rect x="920" y="90" width="160" height="70" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="1000" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#713f12">MISP</text>
  <text x="1000" y="138" text-anchor="middle" font-size="11" fill="#713f12">threat intel (mocked)</text>
  <text x="1000" y="152" text-anchor="middle" font-size="10" fill="#92400e">workflow step ✓</text>

  <rect x="60" y="210" width="160" height="70" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-dasharray="6 4"/>
  <text x="140" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">Cortex</text>
  <text x="140" y="258" text-anchor="middle" font-size="11" fill="#7f1d1d">analysers</text>
  <text x="140" y="272" text-anchor="middle" font-size="10" fill="#991b1b">NOT wired in workflow</text>

  <!-- AI engine block -->
  <rect x="280" y="220" width="560" height="250" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="560" y="248" text-anchor="middle" font-size="16" font-weight="bold" fill="#0c4a6e">AI SOC Engine (ai-engine/ — real code, tested)</text>
  <g font-size="12" fill="#0c4a6e">
    <text x="300" y="274">1. dedupe check</text>
    <text x="300" y="294">2. deterministic safety: block/allow lists, injection detection, IOC extraction</text>
    <text x="300" y="314">3. LLM (Ollama) — optional, timeout + retries</text>
    <text x="300" y="334">4. strict schema validation {summary, severity, confidence, rationale,</text>
    <text x="316" y="350">mitre_techniques, recommended_action, evidence} — malformed rejected</text>
    <text x="300" y="370">5. deterministic overrides (blocklist, missing-IOC cap, injection)</text>
    <text x="300" y="390">6. confidence thresholds (escalate ≥ .75, close ≥ .85)</text>
    <text x="300" y="410">7. fallback → deterministic rules on LLM failure</text>
    <text x="300" y="430">8. human-approval gate (ESCALATE/CLOSE held)</text>
    <text x="300" y="450">9. structured decision log + metrics (/stats)</text>
  </g>

  <!-- TheHive -->
  <rect x="280" y="530" width="240" height="80" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="400" y="560" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">TheHive 5</text>
  <text x="400" y="578" text-anchor="middle" font-size="11" fill="#14532d">POST /api/v1/case (fixed)</text>
  <text x="400" y="593" text-anchor="middle" font-size="10" fill="#166534">case template (mock)</text>

  <rect x="620" y="530" width="240" height="80" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="740" y="560" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">Analyst decision</text>
  <text x="740" y="578" text-anchor="middle" font-size="11" fill="#14532d">/approve · /reject (human approval)</text>
  <text x="740" y="593" text-anchor="middle" font-size="10" fill="#166534">advisory, not L1 replacement</text>

  <rect x="920" y="530" width="160" height="80" rx="8" fill="#eef2ff" stroke="#4338ca"/>
  <text x="1000" y="560" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">Observability</text>
  <text x="1000" y="578" text-anchor="middle" font-size="11" fill="#312e81">decision log, /stats,</text>
  <text x="1000" y="593" text-anchor="middle" font-size="11" fill="#312e81">validation-results/</text>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M120,160 L120,190 L140,190 L140,200"/>
    <path d="M540,160 L540,220"/>
    <path d="M790,160 L790,190 L700,190 L700,220"/>
    <path d="M1000,160 L1000,190 L840,190 L840,220"/>
    <path d="M140,280 L140,340 L280,340"/>
    <path d="M560,470 L520,500 L520,530"/>
    <path d="M640,530 L700,500"/>
    <path d="M860,530 L920,560"/>
    <path d="M120,125 L240,125"/>
    <path d="M320,125 L440,125"/>
    <path d="M640,125 L700,125"/>
    <path d="M880,125 L920,125"/>
  </g>
  <g stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#arrr)" stroke-dasharray="6 4">
    <path d="M160,210 L160,190 L240,190"/>
  </g>
</svg>
