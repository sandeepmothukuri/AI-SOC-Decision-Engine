# AI SOC Engine configuration.
# Values here are defaults; environment variables override (see config.py ENV_MAP).
# Cortex is intentionally disabled until an analyzer is enabled and an API key
# is supplied; enabling it then enriches source/destination IP observables.

model:
  backend: ollama
  name: llama3
  temperature: 0.1
  num_predict: 1024

ollama:
  host: http://localhost:11434

llm:
  timeout_seconds: 30
  max_retries: 1
  request_timeout_seconds: 60

thresholds:
  escalate_min_confidence: 0.75
  close_min_confidence: 0.85
  missing_ioc_confidence_cap: 0.5

human_approval:
  enabled: true
  verdicts: [ESCALATE, CLOSE]

dedupe:
  ttl_seconds: 300

prompt:
  version: v1

safety:
  blocklist_path: safety/blocklist.txt
  allowlist_path: safety/allowlist.txt

thehive:
  url: http://thehive:9000
  api_key: ""
  timeout_seconds: 10

cortex:
  enabled: false
  url: http://cortex:9001
  api_key: ""
  # Set to the ID of an enabled Cortex analyzer that accepts ip observables.
  analyzer_id: ""
  observable_type: ip
  tlp: 0
  timeout_seconds: 10

logging:
  level: INFO
  decision_log: ""
